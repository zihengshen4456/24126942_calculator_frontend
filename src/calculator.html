<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线计算器 · 前后端分离</title>
  <meta name="description" content="前后端分离架构的在线计算器：前端负责交互，后端负责计算与历史记录持久化。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
  <header class="app__header">
    <div class="app__intro">
      <h1 class="app__title">在线计算器</h1>
      <p class="app__subtitle">
        前端只负责交互与展示，表达式解析、数学运算、历史记录持久化全部由后端 API 完成。
      </p>
    </div>
    <div class="app__actions">
      <span id="connection-status" class="status status--unknown">正在检查后端…</span>
      <button type="button" id="theme-toggle" class="button button--ghost" aria-pressed="false">🌙 深色</button>
    </div>
  </header>

  <main class="layout">
    <!-- ---------------- 计算器 ---------------- -->
    <section class="panel calculator" aria-label="计算器">
      <div class="calculator__display">
        <label class="calculator__label" for="expression-input">表达式</label>
        <input
          id="expression-input"
          class="calculator__input"
          type="text"
          inputmode="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="例如：(1+2)*3 或 sqrt(16)+2^3">
        <div class="calculator__result">
          <span class="calculator__result-label">结果</span>
          <output id="result-output" class="calculator__result-value" for="expression-input">—</output>
          <button type="button" id="copy-result" class="button button--ghost button--small">复制</button>
        </div>
      </div>

      <p id="message" class="message message--info" role="status" aria-live="polite"></p>

      <div class="calculator__keypad" role="group" aria-label="计算器按键">
        <button type="button" class="key key--function" data-action="clear">C</button>
        <button type="button" class="key key--function" data-action="backspace" title="退格">⌫</button>
        <button type="button" class="key key--function" data-insert="(">(</button>
        <button type="button" class="key key--function" data-insert=")">)</button>

        <button type="button" class="key" data-insert="7">7</button>
        <button type="button" class="key" data-insert="8">8</button>
        <button type="button" class="key" data-insert="9">9</button>
        <button type="button" class="key key--operator" data-insert="÷">÷</button>

        <button type="button" class="key" data-insert="4">4</button>
        <button type="button" class="key" data-insert="5">5</button>
        <button type="button" class="key" data-insert="6">6</button>
        <button type="button" class="key key--operator" data-insert="×">×</button>

        <button type="button" class="key" data-insert="1">1</button>
        <button type="button" class="key" data-insert="2">2</button>
        <button type="button" class="key" data-insert="3">3</button>
        <button type="button" class="key key--operator" data-insert="−">−</button>

        <button type="button" class="key" data-insert="0">0</button>
        <button type="button" class="key" data-insert=".">.</button>
        <button type="button" class="key key--operator" data-insert="%">%</button>
        <button type="button" class="key key--operator" data-insert="+">+</button>

        <button type="button" class="key key--function" id="scientific-toggle" aria-expanded="false">科学 fx</button>
        <button type="button" class="key key--function" data-insert="^">x^y</button>
        <button type="button" class="key key--function" data-insert="pi">π</button>
        <button type="button" class="key key--equals" data-action="calculate">=</button>
      </div>

      <div class="calculator__scientific" id="scientific-panel" hidden>
        <button type="button" class="key key--sci" data-insert="sin(">sin</button>
        <button type="button" class="key key--sci" data-insert="cos(">cos</button>
        <button type="button" class="key key--sci" data-insert="tan(">tan</button>
        <button type="button" class="key key--sci" data-insert="ln(">ln</button>
        <button type="button" class="key key--sci" data-insert="log(">log</button>
        <button type="button" class="key key--sci" data-insert="sqrt(">√</button>
        <button type="button" class="key key--sci" data-insert="abs(">abs</button>
        <button type="button" class="key key--sci" data-insert="exp(">exp</button>
        <button type="button" class="key key--sci" data-insert="fact(">n!</button>
        <button type="button" class="key key--sci" data-insert="mod(">mod</button>
        <button type="button" class="key key--sci" data-insert="min(">min</button>
        <button type="button" class="key key--sci" data-insert="max(">max</button>
        <button type="button" class="key key--sci" data-insert="pow(">pow</button>
        <button type="button" class="key key--sci" data-insert="hypot(">hypot</button>
        <button type="button" class="key key--sci" data-insert="round(">round</button>
        <button type="button" class="key key--sci" data-insert="e">e</button>
      </div>

      <p class="calculator__hint">
        键盘快捷键：数字与 <code>+ - * / ( ) . % ^</code> 直接输入，<code>Enter</code> 计算，
        <code>Backspace</code> 退格，<code>Esc</code> 清空。
      </p>
    </section>

    <!-- ---------------- 历史记录 ---------------- -->
    <section class="panel history" aria-label="计算历史">
      <div class="history__header">
        <h2 class="panel__title">计算历史</h2>
        <div class="history__stats" id="history-stats">统计数据加载中…</div>
      </div>

      <div class="history__toolbar">
        <input
          id="history-search"
          class="history__search"
          type="search"
          placeholder="搜索表达式或结果…"
          aria-label="搜索历史记录">
        <button type="button" id="history-refresh" class="button">刷新</button>
        <button type="button" id="history-clear" class="button button--danger">清空全部</button>
      </div>

      <ul class="history__list" id="history-list">
        <li class="history__empty">历史记录加载中…</li>
      </ul>

      <div class="history__pager">
        <button type="button" id="page-prev" class="button button--small">上一页</button>
        <span id="page-info" class="history__page-info">第 0 / 0 页</span>
        <button type="button" id="page-next" class="button button--small">下一页</button>
        <label class="history__page-size">
          每页
          <select id="page-size">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
          条
        </label>
      </div>

      <p class="history__footer">
        数据来源：后端 SQLite 数据库 · 接口地址 <code id="api-base">—</code>
      </p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
